name: Build for Hostinger
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - name: Package Hostinger ZIP
        working-directory: dist
        run: zip -r ../admin-motoapex-hostinger.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: admin-motoapex-hostinger
          path: admin-motoapex-hostinger.zip
          include-hidden-files: true
